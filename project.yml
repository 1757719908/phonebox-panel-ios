name: PhoneBoxPanel
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  PhoneBoxPanel:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.phoneboxpanel
        PRODUCT_NAME: PhoneBoxPanel
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

schemes:
  PhoneBoxPanel:
    build:
      targets:
        PhoneBoxPanel: all
    run:
      config: Release
